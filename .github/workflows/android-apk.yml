name: Build THE LIBRARY APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.thelibrary --project-name the_library .
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path("android/app").glob("build.gradle*"))
          changed = 0
          for path in files:
              text = path.read_text()
              text, n1 = re.subn(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', text)
              text, n2 = re.subn(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', text)
              changed += n1 + n2
              path.write_text(text)
          if changed == 0:
              raise SystemExit("Could not find Flutter compileSdk setting in android/app/build.gradle")
          print(f"Updated compileSdk in {changed} place(s)")
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-library-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
