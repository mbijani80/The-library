name: Build THE LIBRARY APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.thelibrary --project-name the_library .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-library-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
