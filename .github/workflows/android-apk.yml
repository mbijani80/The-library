name: Build THE LIBRARY APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.thelibrary --project-name the_library .
      - name: Force Android SDK 36 for app and plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app_files = list(Path("android/app").glob("build.gradle*"))
          changed = 0
          for path in app_files:
              text = path.read_text()
              text, n1 = re.subn(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', text)
              text, n2 = re.subn(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', text)
              changed += n1 + n2
              path.write_text(text)
          root = Path("android/build.gradle")
          if not root.exists():
              raise SystemExit("Expected android/build.gradle was not generated")
          root_text = root.read_text()
          root_text += """
          
          // Ensure every Flutter plugin is compiled against Android API 36.
          subprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                  }
              }
          }
          """
          root.write_text(root_text)
          print(f"Updated app compileSdk in {changed} place(s) and set SDK 36 for all Android subprojects")
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-library-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
