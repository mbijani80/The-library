name: Build THE LIBRARY APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.thelibrary --project-name the_library .
      - name: Configure app Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          app = next((p for p in candidates if p.exists()), None)
          if app is None:
              raise SystemExit("Android app Gradle file was not generated")
          source = app.read_text()
          source, count = re.subn(r'compileSdk\\s*=\\s*flutter\\.compileSdkVersion', 'compileSdk = 36', source)
          if count == 0:
              source, count = re.subn(r'compileSdkVersion\\s+flutter\\.compileSdkVersion', 'compileSdkVersion 36', source)
          if count == 0 and not re.search(r'compileSdk(?:Version)?\\s*(?:=\\s*)?36', source):
              raise SystemExit("Could not safely set app compileSdk to 36")
          app.write_text(source)
          print(f"Configured app compileSdk 36 in {app}")
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Configure Android plugin SDK 36
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          package_root = cache / "hosted" / "pub.dev"
          if not package_root.is_dir():
              raise SystemExit(f"Pub package cache not found: {package_root}")

          changed = []
          patterns = [
              (re.compile(r'(compileSdk\\s*=\\s*)\\d+'), r'\\g<1>36'),
              (re.compile(r'(compileSdkVersion\\s+)\\d+'), r'\\g<1>36'),
              (re.compile(r'(compileSdk\\s*=\\s*)flutter\\.compileSdkVersion'), r'\\g<1>36'),
              (re.compile(r'(compileSdkVersion\\s+)flutter\\.compileSdkVersion'), r'\\g<1>36'),
          ]
          for gradle_file in package_root.glob("*/android/build.gradle*"):
              original = gradle_file.read_text()
              updated = original
              for pattern, replacement in patterns:
                  updated = pattern.sub(replacement, updated)
              if updated != original:
                  gradle_file.write_text(updated)
                  changed.append(str(gradle_file))

          print(f"Inspected Android plugin Gradle files under {package_root}")
          print(f"Updated compileSdk to 36 in {len(changed)} plugin file(s)")
          for item in changed:
              print(item)
          PY
      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-library-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
